name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

  # The OAuth lifecycle harness (`tests/oauth_lifecycle_rmcp.rs`) drives a real
  # Keycloak in a testcontainer, so its tests are `#[ignore]`d by default and get
  # their own job: one container boot (~30 s) plus deliberate waits on token
  # expiry put the binary at a couple of minutes, which does not belong in
  # `check`. `--test-threads=1` because the container is a shared fixture and the
  # scenarios revoke sessions out from under each other otherwise.
  integration-keycloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: OAuth lifecycle against Keycloak
        run: cargo test --test oauth_lifecycle_rmcp -- --ignored --test-threads=1

  release:
    needs: [check, integration-keycloak]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> $GITHUB_OUTPUT

      - name: Create tag and release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
