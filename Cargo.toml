[package]
name = "mcp-framework"
version = "0.5.0"
edition = "2024"
description = "An opinionated framework for building MCP servers with HTTP/stdio transport and OAuth/Basic auth"
license = "MIT"
repository = "https://github.com/Plawn/mcp-framework"

[dependencies]
rmcp = { version = "3.1", features = ["server", "client", "transport-streamable-http-server", "transport-worker", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
http = "1"
tracing = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
anyhow = "1"
oauth2 = "5"
url = "2"
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
# Sink/Stream halves of the in-process loopback transport (`transport::loopback`).
futures = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
urlencoding = "2"
base64 = "0.22"
sha2 = "0.10"
# Local (JWKS) validation of bearer tokens the OAuth proxy did not issue.
# `rust_crypto` is the pure-Rust provider — no C toolchain needed at build time.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
schemars = "1.2.1"
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
redis = ["dep:redis"]
metrics = []

[dev-dependencies]
rmcp = { version = "3.1", features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
# `ServiceExt::oneshot` — drive the axum router in-process, without a listener.
tower = { version = "0.5", features = ["util"] }
# Build signed-shaped JWTs (payload only, no verification) for auth tests.
base64 = "0.22"
# Mint genuinely signed JWTs against a mock JWKS in the bearer-validation tests.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# Ephemeral Keycloak for the OAuth lifecycle harness (`tests/oauth_lifecycle_rmcp.rs`).
# No `http_wait*` feature: the harness polls the realm's discovery document itself,
# which is the only signal that says the realm import actually landed.
testcontainers = "0.27"
# Scrape the `action` URL out of Keycloak's login form (no HTML parser needed).
regex = "1"
# rmcp 3.1 is built on reqwest 0.13 while the framework itself still depends on
# 0.12. `AuthClient::new` takes rmcp's `reqwest::Client`, so the OAuth lifecycle
# harness needs that exact crate — renamed, so every other test binary keeps
# resolving `reqwest` to the framework's own 0.12.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "form", "charset", "http2", "rustls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
